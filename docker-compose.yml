services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://flasky:flasky_pass@db:5432/flasky
    depends_on:
      - db


  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flasky
      POSTGRES_PASSWORD: flasky_pass
      POSTGRES_DB: flasky
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
